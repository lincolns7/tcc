<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Hospital - MedMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h2>MedMatch</h2>
                    <p>Cadastro de Hospital</p>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                    <form action="/cadastrohospital" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome do responsável</label>
                            <input class="form-control" name="nome" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control" name="senha" minlength="6" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nome do hospital</label>
                            <input class="form-control" name="nomeHospital" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">CNPJ</label>
                            <input class="form-control" name="cnpj" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Cadastrar</button>
                        <a class="btn btn-link w-100" href="/login">Já tenho conta</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
