<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro de Hospital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">MedMatch</a>

        <a href="/" class="btn btn-light">
            Voltar
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3>Cadastro de Hospital</h3>

                </div>

                <div class="card-body">

                    <form action="/cadastrohospital" method="post">

                        <div class="mb-3">

                            <label class="form-label">Nome do Responsável</label>

                            <input
                                type="text"
                                class="form-control"
                                name="nome"
                                required>

                        </div>

                        <label>Telefone</label>

                            <input
                                type="text"
                                class="form-control"
                                name="telefone"
                                required>
                        
                        <div class="mb-3">

                            <label class="form-label">E-mail</label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Senha</label>

                            <input
                                type="password"
                                class="form-control"
                                name="senha"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Nome do Hospital</label>

                            <input
                                type="text"
                                class="form-control"
                                name="nomeHospital"
                                required>

                        </div>
                            
                            <label>Endereço</label>

                            <input
                                type="text"
                                class="form-control"
                                name="endereco"
                                required> 

                        <div class="mb-3">

                            <label class="form-label">CNPJ</label>

                            <input
                                type="text"
                                class="form-control"
                                name="cnpj"
                                placeholder="00.000.000/0000-00"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Cadastrar Hospital

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
