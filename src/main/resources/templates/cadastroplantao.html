<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Cadastro de Plantão</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">MedMatch</a>

        <a href="/iniciohospital" class="btn btn-light">
            Voltar
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3>Cadastrar Plantão</h3>

                </div>

                <div class="card-body">

                    <form action="/cadastroplantao" method="post">

                        <div class="mb-3">

                            <label class="form-label">Título</label>

                            <input
                                type="text"
                                class="form-control"
                                name="titulo"
                                placeholder="Ex.: Plantão Noturno"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Especialidade</label>

                            <select
                                class="form-select"
                                name="especialidade"
                                required>

                                <option selected disabled>Selecione</option>

                                <option>Clínico Geral</option>

                                <option>Cardiologia</option>

                                <option>Ortopedia</option>

                                <option>Pediatria</option>

                                <option>Neurologia</option>

                                <option>Dermatologia</option>

                            </select>

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <label>Data</label>

                                <input
                                    type="date"
                                    class="form-control"
                                    name="data"
                                    required>

                            </div>

                            <div class="col-md-6">

                                <label>Horário</label>

                                <input
                                    type="time"
                                    class="form-control"
                                    name="horario"
                                    required>

                            </div>

                        </div>

                        <br>

                        <div class="mb-3">

                            <label>Valor (R$)</label>

                            <input
                                type="number"
                                class="form-control"
                                name="valor"
                                min="1"
                                step="0.01"
                                placeholder="1500.00"
                                required>

                        </div>

                        <input
                            type="hidden"
                            name="status"
                            value="ABERTO">

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Cadastrar Plantão

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
