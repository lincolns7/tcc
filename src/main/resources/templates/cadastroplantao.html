<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro de Plantão - MedMatch</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" th:href="@{/dashboard}">
            MedMatch
        </a>

        <a
            th:href="@{/dashboard}"
            class="btn btn-light">
            Voltar
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3>Cadastro de Plantão</h3>

                </div>

                <div class="card-body">


                    <div
                        th:if="${erro}"
                        class="alert alert-danger"
                        th:text="${erro}">
                    </div>


                    <form
                        th:action="@{/cadastroplantao}"
                        method="post">


                        <div class="mb-3">

                            <label class="form-label">
                                Título do Plantão
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="titulo"
                                placeholder="Ex.: Plantão Hospitalar"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Especialidade
                            </label>

                            <select
                                class="form-select"
                                name="especialidade"
                                required>

                                <option value="" selected disabled>
                                    Selecione uma especialidade
                                </option>

                                <option value="Clínico Geral">
                                    Clínico Geral
                                </option>

                                <option value="Cardiologia">
                                    Cardiologia
                                </option>

                                <option value="Ortopedia">
                                    Ortopedia
                                </option>

                                <option value="Pediatria">
                                    Pediatria
                                </option>

                                <option value="Neurologia">
                                    Neurologia
                                </option>

                                <option value="Dermatologia">
                                    Dermatologia
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Data
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="data"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Horário
                            </label>

                            <input
                                type="time"
                                class="form-control"
                                name="horario"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Valor do Plantão
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    R$
                                </span>

                                <input
                                    type="number"
                                    class="form-control"
                                    name="valor"
                                    min="0.01"
                                    step="0.01"
                                    placeholder="Ex.: 800.00"
                                    required>

                            </div>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Cadastrar Plantão

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
