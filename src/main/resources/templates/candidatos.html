<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Candidatos - MedMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">MedMatch</span>
    <a class="btn btn-sm btn-outline-light" href="/iniciohospital">Voltar</a>
</nav>

<div class="container mt-4">
    <h3 th:text="'Candidatos - ' + ${plantao.titulo}"></h3>
    <p class="text-muted" th:text="'Status do plantão: ' + ${plantao.status}"></p>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>

    <table class="table table-striped bg-white mt-3">
        <thead>
        <tr>
            <th>Médico</th>
            <th>CRM</th>
            <th>Especialidade</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${candidaturas}">
            <td th:text="${c.medico.usuario != null} ? ${c.medico.usuario.nome} : '-'"></td>
            <td th:text="${c.medico.crm}"></td>
            <td th:text="${c.medico.especialidade}"></td>
            <td th:text="${c.status}"></td>
            <td>
                <form th:action="@{'/candidatura/' + ${c.id} + '/aprovar'}" method="post" class="d-inline"
                      th:if="${c.status == 'PENDENTE'}">
                    <button class="btn btn-sm btn-success" type="submit">Aprovar</button>
                </form>
                <form th:action="@{'/candidatura/' + ${c.id} + '/rejeitar'}" method="post" class="d-inline"
                      th:if="${c.status == 'PENDENTE'}">
                    <button class="btn btn-sm btn-danger" type="submit">Rejeitar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(candidaturas)}">
            <td colspan="5" class="text-center text-muted">Nenhum médico se candidatou ainda.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
