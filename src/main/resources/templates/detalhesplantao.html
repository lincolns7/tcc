<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do plantão - MedMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">MedMatch</span>
    <a class="btn btn-sm btn-outline-light" href="/iniciomedicos">Voltar</a>
</nav>

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header">
            <h4 th:text="${plantao.titulo}"></h4>
        </div>
        <div class="card-body">
            <p><strong>Hospital:</strong>
                <span th:text="${plantao.hospital != null} ? ${plantao.hospital.nomeHospital} : '-'"></span></p>
            <p><strong>Especialidade:</strong> <span th:text="${plantao.especialidade}"></span></p>
            <p><strong>Data:</strong> <span th:text="${plantao.data}"></span></p>
            <p><strong>Horário:</strong> <span th:text="${plantao.horario}"></span></p>
            <p><strong>Valor:</strong> <span th:text="'R$ ' + ${plantao.valor}"></span></p>
            <p><strong>Status:</strong> <span th:text="${plantao.status}"></span></p>

            <form th:action="@{'/plantao/' + ${plantao.id} + '/candidatar'}" method="post"
                  th:if="${plantao.status == 'ABERTO'}">
                <button class="btn btn-success" type="submit">Candidatar-se</button>
            </form>
            <p class="text-muted" th:unless="${plantao.status == 'ABERTO'}">
                Este plantão não está mais aberto para candidaturas.
            </p>
        </div>
    </div>
</div>
</body>
</html>
