<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dados do hospital - MedMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h4>Editar dados do hospital</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                    <form action="/hospital/editar" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome do hospital</label>
                            <input class="form-control" name="nomeHospital" th:value="${hospital.nomeHospital}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">CNPJ</label>
                            <input class="form-control" name="cnpj" th:value="${hospital.cnpj}" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Salvar</button>
                        <a class="btn btn-link w-100" href="/iniciohospital">Voltar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
