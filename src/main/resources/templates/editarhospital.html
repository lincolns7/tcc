<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Cadastro - Hospital</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Editar Cadastro do Hospital
                        </h2>

                        <form th:action="@{/editarhospital}"
                              method="post"
                              th:object="${hospital}">

                            <input type="hidden"
                                   th:field="*{id}">

                            <div class="mb-3">

                                <label for="nome" class="form-label">
                                    Nome do responsável
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="nome"
                                       name="nome"
                                       th:value="${usuario.nome}"
                                       required>

                            </div>

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    E-mail
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       th:value="${usuario.email}"
                                       required>

                            </div>
                           
                            <div class="mb-3">

                                <label for="telefone" class="form-label">
                                    Telefone
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="telefone"
                                       th:field="*{telefone}"
                                       placeholder="(43) 99999-9999"
                                       required>

                            </div>

                            <div class="mb-3">

                                <label for="cnpj" class="form-label">
                                    CNPJ
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="cnpj"
                                       th:field="*{cnpj}"
                                       placeholder="00.000.000/0000-00"
                                       required>

                            </div>

                            <div class="mb-3">

                                <label for="nomeHospital" class="form-label">
                                    Nome do hospital
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="nomeHospital"
                                       th:field="*{nomeHospital}"
                                       required>

                            </div>

                            <div class="mb-3">

                                <label for="endereco" class="form-label">
                                    Endereço
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="endereco"
                                       th:field="*{endereco}"
                                       required>

                            </div>

                            <div class="d-flex justify-content-between mt-4">

                                <a href="/dashboard"
                                   class="btn btn-secondary">
                                    Voltar
                                </a>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Salvar alterações
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
