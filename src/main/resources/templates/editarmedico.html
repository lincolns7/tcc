<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar Cadastro - MedMatch</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-sucess">

<div class="container mt-5 mb-5">

    <div class="card shadow p-4 p-md-5">

        <div class="text-center mb-4">

            <h2>Editar Cadastro</h2>

            <p class="text-muted">
                Atualize seus dados pessoais e profissionais.
            </p>

        </div>

        <form
            th:action="@{/editarmedico}"
            th:object="${medico}"
            method="post">

            <input
                type="hidden"
                th:field="*{id}">

            <div class="mb-3">

                <label
                    for="nome"
                    class="form-label">

                    Nome

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nome"
                    name="nome"
                    th:value="${usuario.nome}"
                    required>

            </div>

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label">

                    E-mail

                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    th:value="${usuario.email}"
                    required>

            </div>

            <div class="mb-3">

                <label
                    for="telefone"
                    class="form-label">

                    Telefone

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="telefone"
                    th:field="*{telefone}"
                    placeholder="(43) 99999-9999"
                    required>

            </div>
            
            <div class="mb-3">

                <label
                    for="crm"
                    class="form-label">

                    CRM

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="crm"
                    th:field="*{crm}"
                    readonly>

                <div class="form-text">

                    O CRM não pode ser alterado.

                </div>

            </div>

            <div class="mb-4">

                <label
                    for="especialidade"
                    class="form-label">

                    Especialidade

                </label>

                <select
                    class="form-select"
                    id="especialidade"
                    th:field="*{especialidade}"
                    required>

                    <option value="">
                        Selecione sua especialidade
                    </option>

                    <option value="Clínico Geral">
                        Clínico Geral
                    </option>

                    <option value="Cardiologia">
                        Cardiologia
                    </option>

                    <option value="Ortopedia">
                        Ortopedia
                    </option>

                    <option value="Pediatria">
                        Pediatria
                    </option>

                    <option value="Neurologia">
                        Neurologia
                    </option>

                    <option value="Dermatologia">
                        Dermatologia
                    </option>

                </select>

            </div>

            <div class="d-grid gap-2">

                <button
                    type="submit"
                    class="btn btn-success">

                    Salvar alterações

                </button>

                <a
                    th:href="@{/dashboard}"
                    class="btn btn-secondary">

                    Voltar

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
