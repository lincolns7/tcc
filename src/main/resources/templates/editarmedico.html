<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editar Cadastro - MedMatch</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>
    body {
        background-color: #f5f7fa;
    }

    .container-edicao {
        max-width: 700px;
        margin: 50px auto;
    }

    .card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .titulo {
        font-weight: 600;
        color: #1f2937;
    }

    .subtitulo {
        color: #6b7280;
    }

    .form-label {
        font-weight: 500;
    }

    .btn-salvar {
        width: 100%;
        padding: 12px;
        font-weight: 500;
    }

    .btn-voltar {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="container container-edicao">

<div class="card p-4 p-md-5">

    <div class="text-center mb-4">

        <h2 class="titulo">Editar Cadastro</h2>

        <p class="subtitulo">
            Atualize seus dados pessoais e profissionais.
        </p>

    </div>

    <form th:action="@{/editarmedico}"
          th:object="${medico}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <!-- NOME -->
        <div class="mb-3">

            <label for="nome" class="form-label">
                Nome
            </label>

            <input type="text"
                   class="form-control"
                   id="nome"
                   name="usuario.nome"
                   th:value="${usuario.nome}"
                   required>

        </div>

        <!-- E-MAIL -->
        <div class="mb-3">

            <label for="email" class="form-label">
                E-mail
            </label>

            <input type="email"
                   class="form-control"
                   id="email"
                   name="usuario.email"
                   th:value="${usuario.email}"
                   required>

        </div>

        <!-- TELEFONE -->
        <div class="mb-3">

            <label for="telefone" class="form-label">
                Telefone
            </label>

            <input type="text"
                   class="form-control"
                   id="telefone"
                   th:field="*{telefone}"
                   placeholder="(43) 99999-9999"
                   required>

        </div>

        <!-- CRM -->
        <div class="mb-3">

            <label for="crm" class="form-label">
                CRM
            </label>

            <input type="text"
                   class="form-control"
                   id="crm"
                   th:field="*{crm}"
                   readonly>

            <div class="form-text">
                O CRM não pode ser alterado.
            </div>

        </div>

        <!-- ESPECIALIDADE -->
        <div class="mb-4">

            <label for="especialidade" class="form-label">
                Especialidade
            </label>

            <select class="form-select"
                    id="especialidade"
                    th:field="*{especialidade}"
                    required>

                <option value="">
                    Selecione sua especialidade
                </option>

                <option value="Clínico Geral">
                    Clínico Geral
                </option>

                <option value="Cardiologia">
                    Cardiologia
                </option>

                <option value="Ortopedia">
                    Ortopedia
                </option>

                <option value="Pediatria">
                    Pediatria
                </option>

                <option value="Neurologia">
                    Neurologia
                </option>

                <option value="Dermatologia">
                    Dermatologia
                </option>

            </select>

        </div>

        <button type="submit"
                class="btn btn-primary btn-salvar">
            Salvar alterações
        </button>

        <a href="/iniciomedicos"
           class="btn btn-secondary btn-voltar">
            Voltar
        </a>

    </form>

</div>
</div>

</body>
</html>
