<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plantão - MedMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h4 th:text="${plantao.id != null} ? 'Editar plantão' : 'Cadastrar plantão'"></h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                    <form action="/plantao/salvar" method="post">
                        <input type="hidden" name="id" th:value="${plantao.id}">

                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input class="form-control" name="titulo" th:value="${plantao.titulo}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Especialidade</label>
                            <input class="form-control" name="especialidade" th:value="${plantao.especialidade}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" name="data" th:value="${plantao.data}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Horário</label>
                            <input type="time" class="form-control" name="horario" th:value="${plantao.horario}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Valor (R$)</label>
                            <input type="number" step="0.01" class="form-control" name="valor" th:value="${plantao.valor}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="ABERTO" th:selected="${plantao.status == 'ABERTO'}">ABERTO</option>
                                <option value="PREENCHIDO" th:selected="${plantao.status == 'PREENCHIDO'}">PREENCHIDO</option>
                                <option value="CANCELADO" th:selected="${plantao.status == 'CANCELADO'}">CANCELADO</option>
                            </select>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Salvar</button>
                        <a class="btn btn-link w-100" href="/iniciohospital">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
