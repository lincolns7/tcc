<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>MedMatch</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="text-center">

        <h1 class="mb-3">MedMatch</h1>

        <p class="text-secondary">
            Plataforma de Gerenciamento de Plantões para Profissionais da Saúde
        </p>

        <a href="/login" class="btn btn-success m-2">
            Entrar
        </a>

        <a th:href="@{/cadastromedico}" class="btn btn-primary">
        Cadastrar Médico
        </a>

        <a href="/cadastrohospital" class="btn btn-dark m-2">
            Cadastrar Hospital
        </a>

    </div>

    <hr class="mt-5 mb-4">

    <h3>Plantões Disponíveis</h3>

    <table class="table table-striped table-hover mt-3">

        <thead>

            <tr>

                <th>Título</th>

                <th>Especialidade</th>

                <th>Data</th>

                <th>Horário</th>

                <th>Valor</th>

                <th></th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="plantao : ${plantoes}">

                <td th:text="${plantao.titulo}"></td>

                <td th:text="${plantao.especialidade}"></td>

                <td th:text="${plantao.data}"></td>

                <td th:text="${plantao.horario}"></td>

                <td th:text="${plantao.valor}"></td>

                <td>

                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/plantao/{id}(id=${plantao.id})}">
                        Ver
                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>

</html>
