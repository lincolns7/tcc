<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meus plantões - MedMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">MedMatch</span>
    <div>
        <a class="btn btn-sm btn-light" href="/hospital/editar">Dados do hospital</a>
        <a class="btn btn-sm btn-outline-light" href="/logout">Sair</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h3 th:text="'Plantões de ' + (${hospital != null} ? ${hospital.nomeHospital} : '')"></h3>
        <a class="btn btn-success" href="/plantao/novo">+ Novo plantão</a>
    </div>

    <div class="alert alert-success mt-3" th:if="${sucesso}" th:text="${sucesso}"></div>

    <table class="table table-striped bg-white mt-3">
        <thead>
        <tr>
            <th>Título</th>
            <th>Especialidade</th>
            <th>Data</th>
            <th>Horário</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${plantoes}">
            <td th:text="${p.titulo}"></td>
            <td th:text="${p.especialidade}"></td>
            <td th:text="${p.data}"></td>
            <td th:text="${p.horario}"></td>
            <td th:text="'R$ ' + ${p.valor}"></td>
            <td th:text="${p.status}"></td>
            <td>
                <a class="btn btn-sm btn-info"
                   th:href="@{'/hospital/plantao/' + ${p.id} + '/candidatos'}">Candidatos</a>
                <a class="btn btn-sm btn-warning"
                   th:href="@{'/plantao/' + ${p.id} + '/editar'}">Editar</a>
                <form th:action="@{'/plantao/' + ${p.id} + '/excluir'}" method="post" class="d-inline"
                      onsubmit="return confirm('Excluir este plantão?');">
                    <button class="btn btn-sm btn-danger" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(plantoes)}">
            <td colspan="7" class="text-center text-muted">Nenhum plantão publicado ainda.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
