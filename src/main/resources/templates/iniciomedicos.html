<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedMatch - Área do Médico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand mb-0 h1">
            MedMatch - Área do Médico
        </span>

        <a href="/" class="btn btn-light">
            Sair
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">Plantões Disponíveis</h3>

        </div>

        <div class="card-body">

            <table class="table table-hover table-bordered align-middle">

                <thead class="table-light">

                    <tr>

                        <th>Título</th>

                        <th>Especialidade</th>

                        <th>Data</th>

                        <th>Horário</th>

                        <th>Valor</th>

                        <th>Ação</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="plantao : ${plantoes}">

                        <td th:text="${plantao.titulo}"></td>

                        <td th:text="${plantao.especialidade}"></td>

                        <td th:text="${plantao.data}"></td>

                        <td th:text="${plantao.horario}"></td>

                        <td th:text="'R$ ' + ${plantao.valor}"></td>

                        <td>

                            <a href="#" class="btn btn-success btn-sm">
                                Ver Detalhes
                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="/" class="btn btn-secondary">
            Voltar para a Página Inicial
        </a>

    </div>

</div>

</body>

</html>
