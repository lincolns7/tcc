--><!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>MedMatch - Meus Plantões</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand"
            th:href="@{/dashboard}">

            MedMatch

        </a>

        <a
            th:href="@{/dashboard}"
            class="btn btn-light">

            Voltar

        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="text-center mb-4">

        <h2>Meus Plantões</h2>

        <p class="text-muted">

            Plantões cadastrados pelo seu hospital

        </p>

    </div>

    <div
        th:if="${#lists.isEmpty(plantoes)}"
        class="alert alert-info">

        Você ainda não possui plantões cadastrados.

    </div>

    <div
        th:unless="${#lists.isEmpty(plantoes)}"
        class="table-responsive">

        <table class="table table-hover table-bordered bg-white shadow">

            <thead class="table-primary">

                <tr>

                    <th>Título</th>

                    <th>Especialidade</th>

                    <th>Data</th>

                    <th>Horário</th>

                    <th>Valor</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                <tr
                    th:each="plantao : ${plantoes}">

                    <td
                        th:text="${plantao.titulo}">

                        Plantão

                    </td>

                    <td
                        th:text="${plantao.especialidade}">

                        Especialidade

                    </td>

                    <td
                        th:text="${#temporals.format(plantao.data, 'dd/MM/yyyy')}">

                        00/00/0000

                    </td>

                    <td
                        th:text="${#temporals.format(plantao.horario, 'HH:mm')}">

                        00:00

                    </td>

                    <td>

                        R$

                        <span
                            th:text="${#numbers.formatDecimal(plantao.valor, 1, 2)}">

                            0,00

                        </span>

                    </td>

                    <td>

                        <span
                            th:if="${plantao.status == 'ABERTO'}"
                            class="badge bg-success">

                            Aberto

                        </span>

                        <span
                            th:if="${plantao.status == 'FECHADO'}"
                            class="badge bg-secondary">

                            Fechado

                        </span>

                        <span
                            th:if="${plantao.status != 'ABERTO' and plantao.status != 'FECHADO'}"
                            class="badge bg-secondary"
                            th:text="${plantao.status}">

                            Status

                        </span>

                    </td>

                    <td>


                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
