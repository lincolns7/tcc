<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>MedMatch - Minhas Candidaturas</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a
            class="navbar-brand"
            th:href="@{/dashboard}">

            MedMatch

        </a>

        <a
            th:href="@{/dashboard}"
            class="btn btn-danger">

            Voltar

        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="text-center mb-4">

        <h2>Minhas Candidaturas</h2>

        <p class="text-muted">

            Consulte os plantões aos quais você se candidatou.

        </p>

    </div>


    <div
        th:if="${#lists.isEmpty(candidaturas)}"
        class="alert alert-info text-center">

        Você ainda não possui candidaturas.

    </div>


    <div
        th:unless="${#lists.isEmpty(candidaturas)}"
        class="table-responsive">

        <table class="table table-hover table-bordered bg-white shadow">

            <thead class="table-primary">

                <tr>

                    <th>Plantão</th>

                    <th>Hospital</th>

                    <th>Especialidade</th>

                    <th>Data</th>

                    <th>Horário</th>

                    <th>Valor</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody>

                <tr
                    th:each="candidatura : ${candidaturas}">

                    <td
                        th:text="${candidatura.plantao.titulo}">

                        Plantão

                    </td>


                    <td
                        th:text="${candidatura.plantao.hospital_id.nomeHospital}">

                        Hospital

                    </td>


                    <td
                        th:text="${candidatura.plantao.especialidade}">

                        Especialidade

                    </td>


                    <td
                        th:text="${#temporals.format(candidatura.plantao.data, 'dd/MM/yyyy')}">

                        00/00/0000

                    </td>


                    <td
                        th:text="${#temporals.format(candidatura.plantao.horario, 'HH:mm')}">

                        00:00

                    </td>


                    <td>

                        R$

                        <span
                            th:text="${#numbers.formatDecimal(candidatura.plantao.valor, 1, 2)}">

                            0,00

                        </span>

                    </td>


                    <td>

                        <span
                            th:if="${candidatura.status == 'PENDENTE'}"
                            class="badge bg-warning text-dark">

                            Pendente

                        </span>


                        <span
                            th:if="${candidatura.status == 'ACEITA'}"
                            class="badge bg-success">

                            Aceita

                        </span>


                        <span
                            th:if="${candidatura.status == 'RECUSADA'}"
                            class="badge bg-danger">

                            Recusada

                        </span>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
