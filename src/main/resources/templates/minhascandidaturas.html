<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administração - MedMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">MedMatch - Administração</span>
    <a class="btn btn-sm btn-outline-light" href="/logout">Sair</a>
</nav>

<div class="container mt-4">
    <h4>Usuários</h4>
    <table class="table table-sm table-striped bg-white">
        <thead>
        <tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Tipo</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nome}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.tipo}"></td>
            <td>
                <form th:action="@{'/admin/usuario/' + ${u.id} + '/excluir'}" method="post"
                      onsubmit="return confirm('Excluir este usuário?');">
                    <button class="btn btn-sm btn-danger" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-4">Médicos</h4>
    <table class="table table-sm table-striped bg-white">
        <thead>
        <tr><th>ID</th><th>Nome</th><th>CRM</th><th>Especialidade</th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${medicos}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.usuario != null} ? ${m.usuario.nome} : '-'"></td>
            <td th:text="${m.crm}"></td>
            <td th:text="${m.especialidade}"></td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-4">Hospitais</h4>
    <table class="table table-sm table-striped bg-white">
        <thead>
        <tr><th>ID</th><th>Hospital</th><th>CNPJ</th><th>Responsável</th></tr>
        </thead>
        <tbody>
        <tr th:each="h : ${hospitais}">
            <td th:text="${h.id}"></td>
            <td th:text="${h.nomeHospital}"></td>
            <td th:text="${h.cnpj}"></td>
            <td th:text="${h.usuario != null} ? ${h.usuario.nome} : '-'"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
