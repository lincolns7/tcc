<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Solicitações - MedMatch</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">

    <div class="container">

        <a
            class="navbar-brand"
            th:href="@{/dashboard}">

            MedMatch

        </a>

        <a
            th:href="@{/dashboard}"
            class="btn btn-light">

            Voltar ao Dashboard

        </a>

    </div>

</nav>

<div class="container">

    <div class="mb-4">

        <h2>Solicitações de Plantonistas</h2>

        <p class="text-muted">

            Veja os médicos que se candidataram aos seus plantões.

        </p>

    </div>

    <div
        th:if="${#lists.isEmpty(candidaturas)}"
        class="alert alert-info">

        Não existem solicitações no momento.

    </div>

    <div
        th:unless="${#lists.isEmpty(candidaturas)}"
        class="card shadow">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-primary">

                    <tr>

                        <th>Médico</th>

                        <th>CRM</th>

                        <th>Especialidade</th>

                        <th>Plantão</th>

                        <th>Data</th>

                        <th>Horário</th>

                        <th>Status</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr
                        th:each="candidatura : ${candidaturas}">

                        <td
                            th:text="${candidatura.medico.usuario.nome}">

                            Médico

                        </td>

                        <td
                            th:text="${candidatura.medico.crm}">

                            CRM

                        </td>

                        <td
                            th:text="${candidatura.medico.especialidade}">

                            Especialidade

                        </td>

                        <td
                            th:text="${candidatura.plantao.titulo}">

                            Plantão

                        </td>

                        <td
                            th:text="${#temporals.format(candidatura.plantao.data, 'dd/MM/yyyy')}">

                            00/00/0000

                        </td>

                        <td
                            th:text="${#temporals.format(candidatura.plantao.horario, 'HH:mm')}">

                            00:00

                        </td>

                        <td>

                            <span
                                th:if="${candidatura.status == 'PENDENTE'}"
                                class="badge bg-warning text-dark">

                                Pendente

                            </span>

                            <span
                                th:if="${candidatura.status == 'ACEITA'}"
                                class="badge bg-success">

                                Aceita

                            </span>

                            <span
                                th:if="${candidatura.status == 'RECUSADA'}"
                                class="badge bg-danger">

                                Recusada

                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
